services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio_local_cambiar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: on-failure

  productor:
    image: observatorio-sismico-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "productor.py"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      USGS_FEED_URL: ${USGS_FEED_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson}
      USGS_POLL_INTERVAL_SECONDS: ${USGS_POLL_INTERVAL_SECONDS:-60}
      HISTORICAL_DATA_DIR: /data/historico
      REPLAY_SPEED_FACTOR: ${REPLAY_SPEED_FACTOR:-1000000}
      USGS_SPLIT_THRESHOLD: ${USGS_SPLIT_THRESHOLD:-18000}
    volumes:
      - ./datos/historico:/data/historico
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if b'productor.py' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

  consumidor:
    image: observatorio-sismico-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "consumidor.py"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: observatorio-consumidor
      POSTGRES_HOST: postgres
      COUNTRIES_GEOJSON_PATH: /data/paises.geojson
    volumes:
      - ./frontend/public/datos/paises.geojson:/data/paises.geojson:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if b'consumidor.py' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: on-failure

  api:
    image: observatorio-sismico-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "api.py"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      NETLIFY_ORIGIN: ${NETLIFY_ORIGIN:-}
      INGESTION_STALE_SECONDS: ${INGESTION_STALE_SECONDS:-180}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/salud', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure

volumes:
  postgres_data:
  kafka_data:
